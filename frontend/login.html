<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialClaw - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 60px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            width: 100%;
            max-width: 350px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 30px;
            text-align: left;
            border-radius: 8px;
        }

        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .info-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .api-info {
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🦀</div>
        <h1>SocialClaw</h1>
        <p class="subtitle">平行人生推演局</p>
        
        <button class="login-btn" onclick="login()">
            🔑 立即登录
        </button>

        <div class="info-box">
            <h3>📌 使用说明</h3>
            <p>1. 点击"立即登录"按钮</p>
            <p>2. 自动跳转到 Second Me 授权页面</p>
            <p>3. 在 Second Me 页面点击"授权"</p>
            <p>4. 自动回调到 SocialClaw，登录成功</p>
        </div>

        <div id="status" class="status"></div>

        <div class="api-info">
            API 服务: http://localhost:8000<br>
            API 文档: <a href="http://localhost:8000/docs" target="_blank">http://localhost:8000/docs</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        function login() {
            // 重定向到 OAuth2 登录端点
            const loginUrl = `${API_BASE_URL}/api/v1/auth/oauth2/login`;
            window.location.href = loginUrl;
        }

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        // 检查是否是从回调页面返回的
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success')) {
            showStatus('✅ 授权成功！请查看 API 文档进行后续操作。', 'success');
            // 清除 URL 参数
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (urlParams.get('error')) {
            showStatus('❌ 授权失败：' + urlParams.get('error'), 'error');
            // 清除 URL 参数
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
