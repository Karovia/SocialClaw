<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 回调处理</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .success {
            color: #28a745;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .error {
            color: #dc3545;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OAuth2 授权回调</h1>
        <div id="status"></div>
        <div id="userInfo"></div>
        
        <div class="info">
            <strong>说明：</strong>这是 OAuth2 授权的回调页面示例。
            实际应用中，回调处理应该在后端完成（/auth/callback），
            然后后端将用户重定向到前端页面并携带 token。
        </div>
    </div>

    <script>
        // 这个页面仅用于演示，实际的回调处理在后端
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('code')) {
            const code = urlParams.get('code');
            document.getElementById('status').innerHTML = 
                `<div class="success">✅ 接收到授权码: ${code.substring(0, 20)}...</div>`;
            
            // 实际应用中，这里应该调用后端接口处理回调
            document.getElementById('userInfo').innerHTML = `
                <div class="info">
                    <p>实际流程：</p>
                    <ol>
                        <li>后端收到 code 参数</li>
                        <li>用 code 换取 access_token</li>
                        <li>获取用户信息</li>
                        <li>创建/更新用户账号</li>
                        <li>生成 JWT Token 并返回</li>
                    </ol>
                    <p>请查看 API 文档了解详细信息：<a href="http://localhost:8000/docs" target="_blank">http://localhost:8000/docs</a></p>
                </div>
            `;
        } else if (urlParams.has('error')) {
            document.getElementById('status').innerHTML = 
                `<div class="error">❌ 授权失败: ${urlParams.get('error')}</div>`;
        } else {
            document.getElementById('status').innerHTML = 
                `<div class="error">⚠️ 没有接收到授权码</div>`;
        }
    </script>
</body>
</html>
